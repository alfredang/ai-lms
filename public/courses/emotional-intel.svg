<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#18181b"/>
  <defs>
    <linearGradient id="eiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Brain outline -->
  <ellipse cx="200" cy="120" rx="80" ry="65" fill="none" stroke="url(#eiGrad)" stroke-width="3"/>
  <!-- Brain waves/folds -->
  <path d="M140 100 Q160 80 180 100 Q200 120 220 100 Q240 80 260 100" stroke="#ec4899" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M150 130 Q170 150 190 130 Q210 110 230 130 Q250 150 260 130" stroke="#8b5cf6" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Heart in center -->
  <path d="M200 120 C200 105 180 95 175 110 C170 125 200 150 200 150 C200 150 230 125 225 110 C220 95 200 105 200 120" fill="url(#eiGrad)"/>
  <!-- Emotion indicators -->
  <circle cx="100" cy="180" r="25" fill="#22c55e" opacity="0.8"/>
  <text x="100" y="186" font-size="20" text-anchor="middle">:)</text>
  <circle cx="160" cy="200" r="25" fill="#eab308" opacity="0.8"/>
  <text x="160" y="206" font-size="20" text-anchor="middle">:|</text>
  <circle cx="240" cy="200" r="25" fill="#3b82f6" opacity="0.8"/>
  <text x="240" y="206" font-size="20" text-anchor="middle">:(</text>
  <circle cx="300" cy="180" r="25" fill="#ef4444" opacity="0.8"/>
  <text x="300" y="186" font-size="20" text-anchor="middle">&gt;:(</text>
  <!-- Text -->
  <text x="200" y="265" font-family="system-ui" font-size="18" fill="white" text-anchor="middle" font-weight="600">Emotional Intelligence</text>
</svg>