  <rect x="85" y="130" width="15" height="20" fill="#1a2332"/>
  <rect x="65" y="160" width="15" height="20" fill="#1a2332"/>
  <rect x="85" y="160" width="15" height="20" fill="#1a2332"/>
  <rect x="120" y="80" width="60" height="140" fill="#22d3ee" opacity="0.9"/>
  <rect x="130" y="90" width="15" height="20" fill="#1a2332"/>
  <rect x="155" y="90" width="15" height="20" fill="#1a2332"/>
  <rect x="130" y="120" width="15" height="20" fill="#1a2332"/>
  <rect x="155" y="120" width="15" height="20" fill="#1a2332"/>
  <rect x="130" y="150" width="15" height="20" fill="#1a2332"/>
