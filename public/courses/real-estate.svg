  <line x1="345" y1="100" x2="370" y2="100" stroke="#fbbf24" stroke-width="3"/>
  <line x1="360" y1="100" x2="360" y2="110" stroke="#fbbf24" stroke-width="3"/>
  <line x1="370" y1="100" x2="370" y2="110" stroke="#fbbf24" stroke-width="3"/>
