<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#1a1a2e"/>
  <defs>
    <linearGradient id="llmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
  </defs>
  <!-- Neural network layers -->
  <g opacity="0.3">
    <circle cx="100" cy="80" r="15" fill="#00d9ff"/>
    <circle cx="100" cy="150" r="15" fill="#00d9ff"/>
    <circle cx="100" cy="220" r="15" fill="#00d9ff"/>
    <circle cx="200" cy="100" r="15" fill="#0088ff"/>
    <circle cx="200" cy="200" r="15" fill="#0088ff"/>
    <circle cx="300" cy="150" r="15" fill="#0066ff"/>
  </g>
  <!-- Connection lines -->
  <g stroke="url(#llmGrad)" stroke-width="2" opacity="0.5">
    <line x1="115" y1="80" x2="185" y2="100"/>
    <line x1="115" y1="80" x2="185" y2="200"/>
    <line x1="115" y1="150" x2="185" y2="100"/>
    <line x1="115" y1="150" x2="185" y2="200"/>
    <line x1="115" y1="220" x2="185" y2="100"/>
    <line x1="115" y1="220" x2="185" y2="200"/>
    <line x1="215" y1="100" x2="285" y2="150"/>
    <line x1="215" y1="200" x2="285" y2="150"/>
  </g>
  <!-- Tuning dial -->
  <circle cx="200" cy="150" r="50" stroke="url(#llmGrad)" stroke-width="4" fill="none"/>
  <circle cx="200" cy="150" r="40" stroke="#00d9ff" stroke-width="2" fill="none" opacity="0.5"/>
  <line x1="200" y1="150" x2="230" y2="120" stroke="#00d9ff" stroke-width="4" stroke-linecap="round"/>
  <!-- Text -->
  <text x="200" y="270" font-family="system-ui" font-size="18" fill="white" text-anchor="middle" font-weight="600">LLM Fine-tuning</text>
</svg>