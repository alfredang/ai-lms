<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#0f172a"/>
  <defs>
    <linearGradient id="vibeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Code window -->
  <rect x="80" y="50" width="240" height="160" rx="8" fill="#1e293b" stroke="url(#vibeGrad)" stroke-width="2"/>
  <circle cx="100" cy="70" r="5" fill="#ef4444"/>
  <circle cx="118" cy="70" r="5" fill="#eab308"/>
  <circle cx="136" cy="70" r="5" fill="#22c55e"/>
  <!-- Code lines with gradient -->
  <rect x="100" y="95" width="100" height="8" rx="2" fill="#06b6d4" opacity="0.8"/>
  <rect x="100" y="115" width="140" height="8" rx="2" fill="#8b5cf6" opacity="0.8"/>
  <rect x="120" y="135" width="80" height="8" rx="2" fill="#ec4899" opacity="0.8"/>
  <rect x="120" y="155" width="120" height="8" rx="2" fill="#06b6d4" opacity="0.8"/>
  <rect x="100" y="175" width="60" height="8" rx="2" fill="#8b5cf6" opacity="0.8"/>
  <!-- Music waves -->
  <g transform="translate(280, 130)">
    <rect x="0" y="15" width="4" height="20" rx="2" fill="#06b6d4" opacity="0.8">
      <animate attributeName="height" values="20;40;20" dur="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="8" y="10" width="4" height="30" rx="2" fill="#8b5cf6" opacity="0.8">
      <animate attributeName="height" values="30;15;30" dur="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="5" width="4" height="40" rx="2" fill="#ec4899" opacity="0.8">
      <animate attributeName="height" values="40;25;40" dur="0.4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- Text -->
  <text x="200" y="260" font-family="system-ui" font-size="18" fill="white" text-anchor="middle" font-weight="600">Vibe Coding</text>
</svg>