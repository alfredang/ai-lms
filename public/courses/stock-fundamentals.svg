<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#0f1419"/>
  <defs>
    <linearGradient id="stockGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- Grid lines -->
  <g stroke="#1f2937" stroke-width="1">
    <line x1="60" y1="60" x2="60" y2="220"/>
    <line x1="60" y1="220" x2="340" y2="220"/>
    <line x1="60" y1="180" x2="340" y2="180" stroke-dasharray="4,4" opacity="0.5"/>
    <line x1="60" y1="140" x2="340" y2="140" stroke-dasharray="4,4" opacity="0.5"/>
    <line x1="60" y1="100" x2="340" y2="100" stroke-dasharray="4,4" opacity="0.5"/>
  </g>
  <!-- Stock chart line -->
  <polyline points="80,180 120,160 160,170 200,120 240,100 280,80 320,90" fill="none" stroke="url(#stockGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Area under line -->
  <polygon points="80,180 120,160 160,170 200,120 240,100 280,80 320,90 320,220 80,220" fill="url(#stockGrad)" opacity="0.2"/>
  <!-- Candlesticks -->
  <g>
    <rect x="95" y="140" width="8" height="30" fill="#10b981"/>
    <line x1="99" y1="130" x2="99" y2="180" stroke="#10b981" stroke-width="2"/>
    <rect x="145" y="150" width="8" height="25" fill="#ef4444"/>
    <line x1="149" y1="145" x2="149" y2="185" stroke="#ef4444" stroke-width="2"/>
    <rect x="195" y="110" width="8" height="35" fill="#10b981"/>
    <line x1="199" y1="100" x2="199" y2="155" stroke="#10b981" stroke-width="2"/>
  </g>
  <!-- Dollar sign -->
  <text x="320" y="75" font-family="system-ui" font-size="24" fill="#10b981" font-weight="bold">$</text>
  <!-- Text -->
  <text x="200" y="265" font-family="system-ui" font-size="18" fill="white" text-anchor="middle" font-weight="600">Stock Market Fundamentals</text>
</svg>