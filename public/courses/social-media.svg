<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#0c1222"/>
  <defs>
    <linearGradient id="smGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- Phone frame -->
  <rect x="140" y="40" width="120" height="200" rx="15" fill="#1a1a2e" stroke="url(#smGrad)" stroke-width="3"/>
  <rect x="150" y="60" width="100" height="160" rx="5" fill="#2a2a3e"/>
  <!-- Social icons -->
  <circle cx="200" cy="100" r="25" fill="#e879f9" opacity="0.8"/>
  <rect x="188" y="88" width="24" height="24" rx="6" stroke="white" stroke-width="2" fill="none"/>
  <circle cx="200" cy="100" r="8" stroke="white" stroke-width="2" fill="none"/>
  <circle cx="208" cy="92" r="2" fill="white"/>
  <!-- Heart icons floating -->
  <path d="M100 100 C100 90 85 85 82 95 C79 105 100 120 100 120 C100 120 121 105 118 95 C115 85 100 90 100 100" fill="#ef4444" opacity="0.8"/>
  <path d="M300 80 C300 70 285 65 282 75 C279 85 300 100 300 100 C300 100 321 85 318 75 C315 65 300 70 300 80" fill="#ef4444" opacity="0.6"/>
  <path d="M320 150 C320 143 310 140 308 147 C306 154 320 165 320 165 C320 165 334 154 332 147 C330 140 320 143 320 150" fill="#ef4444" opacity="0.7"/>
  <!-- Like counts -->
  <text x="100" y="145" font-family="system-ui" font-size="12" fill="#ef4444" text-anchor="middle">2.5K</text>
  <text x="300" y="120" font-family="system-ui" font-size="12" fill="#ef4444" text-anchor="middle">1.2K</text>
  <!-- Comments bubble -->
  <circle cx="80" cy="180" r="20" fill="#3b82f6" opacity="0.7"/>
  <text x="80" y="185" font-family="system-ui" font-size="16" fill="white" text-anchor="middle">...</text>
  <!-- Share icons -->
  <polygon points="320,200 340,215 320,230 325,215" fill="#22c55e" opacity="0.7"/>
  <!-- Engagement lines -->
  <path d="M118 100 L145 100" stroke="#e879f9" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
  <path d="M255 100 L282 85" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
  <!-- Text -->
  <text x="200" y="275" font-family="system-ui" font-size="18" fill="white" text-anchor="middle" font-weight="600">Social Media Strategy</text>
</svg>